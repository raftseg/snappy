name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.24.x", "1.27.x"]
        # amd64 and arm64 each have assembly; both run it and the pure Go code.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: go test, pure Go code only
        run: go test -count=1 -tags noasm ./...
      - name: go test, 32-bit
        if: runner.arch == 'X64'
        run: GOARCH=386 go test -count=1 -short ./...
      - run: go test -count=1 -short -race ./...
